<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chucherías Blas</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Playfair+Display&display=swap" rel="stylesheet">
<style>
:root{--c1:#d9480f;--c2:#fff4e6;--tx:#1f1f1f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px;font-family:"Open Sans",Arial,sans-serif;color:var(--tx);background:#fff}
.resumen{background:var(--c2);border:2px solid var(--c1);border-radius:14px;padding:16px;margin-bottom:26px}
.resumen h2{margin:0 0 10px;font-size:22px}
.datos{display:flex;gap:16px;flex-wrap:wrap}
.datos div{flex:1;min-width:150px;background:#fff;border-radius:10px;padding:10px 14px}
.datos span{display:block;font-size:14px;color:#666}
.datos strong{font-size:26px;color:var(--c1)}
.vaciar{margin-top:12px;border:0;background:none;color:#666;text-decoration:underline;cursor:pointer;font-size:14px}
.cat{margin-bottom:30px}
.cat>h2{text-align:center;font-size:clamp(30px,4.2vw,50px);margin:0 0 18px;font-weight:700}
.fila{padding:26px 0;border-top:1px solid #e6e6e6;display:grid;gap:28px;align-items:center}
.lado{grid-template-columns:1fr 1fr}
.dos{grid-template-columns:1fr 1fr}
.col{text-align:center}
.foto{aspect-ratio:16/9;background:#f5f5f5;border:2px dashed #e2e2e2;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.txt{text-align:center}
.nombre{font-family:"Playfair Display",Georgia,serif;font-weight:400;line-height:1.2}
.lado .nombre{font-size:clamp(28px,3.6vw,46px);margin-bottom:22px}
.dos .nombre{font-size:clamp(20px,2.2vw,28px);margin:16px 0 18px}
.dato{font-weight:700;font-size:17px;margin:8px 0}
.nd{color:#b00020;font-weight:700;font-size:16px;margin:0 0 6px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.ctrl button{width:40px;height:40px;border-radius:50%;border:2px solid var(--c1);background:#fff;color:var(--c1);font-size:24px;line-height:1;cursor:pointer}
.ctrl button:active{background:var(--c1);color:#fff}
.ctrl button:disabled{opacity:.3;cursor:not-allowed}
.ctrl b{min-width:28px;font-size:21px}
.gal{grid-template-columns:1fr 2fr;align-items:start}
.pila{display:grid;gap:12px}
.pila .foto,.principal .foto{aspect-ratio:4/3}
.principal .txt{margin-top:16px}
.btn{display:inline-block;margin-top:12px;margin-right:14px;padding:9px 18px;border-radius:24px;background:var(--c1);color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.pedido{max-width:760px;margin:0 auto}
.pedido h2{text-align:center;font-size:clamp(28px,4vw,44px);margin:0 0 18px}
.pedido table{width:100%;border-collapse:collapse;font-size:17px}
.pedido th{font-size:14px;color:#666;text-align:left;border-bottom:2px solid var(--c1);padding:8px 6px}
.pedido td{padding:12px 6px;border-bottom:1px solid #e6e6e6;vertical-align:top}
.pedido .num,.pedido th.num{text-align:right;white-space:nowrap}
.total{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--c2);border:2px solid var(--c1);border-radius:14px;padding:16px 20px;margin-top:20px;font-weight:700}
.total strong{font-size:28px;color:var(--c1)}
.vacio{text-align:center;color:#777;padding:30px 0}
.pronto{text-align:center;color:#888;font-style:italic}
.cat-titulo{text-align:center;font-size:clamp(30px,4.2vw,50px);margin:0 0 18px;font-weight:700}
.cat-cab{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.cat-cab h2{flex:1;margin:0;text-align:center;font-size:clamp(30px,4.2vw,50px);font-weight:700}
.cat-cab .esp{width:58px;flex:none}
.carro{position:relative;flex:none;width:58px;height:58px;display:block;border-radius:16px;transition:transform .15s,box-shadow .15s}
.carro img{width:100%;height:100%;display:block}
.carro:hover,.carro:focus-visible{transform:translateY(-2px);box-shadow:0 6px 14px rgba(217,72,15,.35)}
.carro:active{transform:none;box-shadow:none}
.carro .num-carro{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c1);color:#fff;border:2px solid #fff;font-size:13px;font-weight:700;line-height:20px;text-align:center}
.marca{text-align:center;font-size:clamp(36px,5vw,60px);margin:50px 0 10px;padding-top:24px;border-top:4px solid var(--c1);color:var(--c1)}
@media(max-width:600px){.gal{grid-template-columns:1fr}.pila{grid-template-columns:repeat(3,1fr)}.lado{grid-template-columns:1fr}.lado.inv .foto{order:-1}.dos{gap:14px}.fila{padding:20px 0}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ================= DATOS (aquí se agregan los productos nuevos) =================
   Cada bloque de abajo es una categoría (por ejemplo "Papitas de 10") de una página de Google Sites.
   - pagina: nombre de la página de Google Sites a la que pertenece (lays, yummies, o una nueva).
   - Para agregar OTRA página o categoría: copia un bloque completo, ponlo ARRIBA (lo más nuevo primero),
     cambia la clave, "pagina", el título y los productos. Los "id" deben ser únicos.
   - No hace falta tocar nada más: el resumen y la página del pedido incluyen los productos nuevos solos.
   - diseno: "izq" = foto a la izquierda, "der" = foto a la derecha, "dos" = dos productos en columnas,
     "gal" = un producto con varias fotos.
   - Un producto agotado lleva  disponible: false
   - Las fotos están en la carpeta "fotos" del repositorio (foto: "fotos/Nombre.jpg").
   Direcciones para incorporar:  ?vista=<pagina>  (toda la página),  ?vista=<clave>  (una categoría),
   ?vista=resumen_<pagina> (resumen solo de esa página, ej. resumen_lays),
   ?vista=pedido (pedido completo con el total de TODAS las páginas)  */
const U = "12 Unidades";
const CATALOGO = {
  yummies_10: { pagina: "yummies", titulo: "Papitas de 10", diseno: ["dos", "dos", "dos"], productos: [
    { id: "q10-palitos",   nombre: "Palitos de Papas", presentacion: U, precio: 100, foto: "fotos/Palito%20de%20Papa.jpg" },
    { id: "q10-anillito",  nombre: "Anillito",         presentacion: U, precio: 100, foto: "fotos/Anillitos.jpg" },
    { id: "q10-cappy",     nombre: "Cappy",            presentacion: U, precio: 100, foto: "fotos/Cappy%20de%20queso.jpg" },
    { id: "q10-cappy-pic", nombre: "Cappy Picante",    presentacion: U, precio: 100, foto: "fotos/Cappy%20Picante.jpg" },
    { id: "q10-tacos",     nombre: "Tacos de Queso",   presentacion: U, precio: 100, foto: "fotos/Taco%20Queso.jpg" }
  ]},
  yummies_15: { pagina: "yummies", titulo: "Papitas de 15", diseno: ["izq"], productos: [
    { id: "q15-platanito", nombre: "Platanito Zambos", presentacion: U, precio: 150, foto: "fotos/Platanitos.jpg" }
  ]},
  yummies_20: { pagina: "yummies", titulo: "Papitas de 20", diseno: ["gal"], productos: [
    { id: "q20-taqueritos", nombre: "Taqueritos", presentacion: U, precio: 200, foto: "fotos/Taqueritos.jpg", fotos: ["fotos/Taqueritos%20Queso%20Fundido.jpg", "fotos/Taqueritos%20Dragon%20de%20Fuego.jpg", "fotos/Taqueritos%20Dragon%20de%20Hielo.jpg"] }
  ]},
  lays_10: { pagina: "lays", titulo: "Papitas de 10", diseno: ["izq", "der", "izq", "dos"], productos: [
    { id: "p10-chito-rojo",   nombre: "Chito Rojo",   presentacion: U, precio: 105, foto: "fotos/Chito%20Rojo.jpg" },
    { id: "p10-chito-azul",   nombre: "Chito Azul",   presentacion: U, precio: 105, foto: "fotos/Chito%20Azul.jpg" },
    { id: "p10-chito-blanco", nombre: "Chito Blanco", presentacion: U, precio: 105, foto: "fotos/Chitos%20Blancos.jpg" },
    { id: "p10-chito-verde",  nombre: "Chito Verde",  presentacion: U, precio: 105, foto: "fotos/Chito%20Verde.jpg" },
    { id: "p10-fandango",     nombre: "Fandango",     presentacion: U, precio: 105, foto: "fotos/Fandangos.jpg" }
  ]},
  lays_15: { pagina: "lays", titulo: "Papitas de 15", diseno: ["dos", "dos", "dos"], productos: [
    { id: "p15-hoj-queso",    nombre: "Hojuelitas Queso",    presentacion: U, precio: 155, foto: "fotos/Hojuelita%20de%20Queso.jpg" },
    { id: "p15-hoj-bbq",      nombre: "Hojuelitas BBQ",      presentacion: U, precio: 155, foto: "fotos/Hojuelitas%20BBQ.jpg" },
    { id: "p15-hoj-tocineta", nombre: "Hojuelitas Tocineta", presentacion: U, precio: 155, foto: "fotos/Hojuelitas%20Tocinetas.jpg" },
    { id: "p15-hoj-picante",  nombre: "Hojuelitas Picante",  presentacion: U, precio: 155, foto: "fotos/Hojuelitas%20Picantes.jpg", disponible: false },
    { id: "p15-dorito-rojo",  nombre: "Dorito Rojo",         presentacion: U, precio: 155, foto: "fotos/Dorito%20Rojo.jpg" },
    { id: "p15-dorito-negro", nombre: "Dorito Negro",        presentacion: U, precio: 155, foto: "fotos/Dorito%20Negro.jpg" }
  ]},
  lays_20: { pagina: "lays", titulo: "Papitas de 20", diseno: ["dos", "izq", "der", "dos"], productos: [
    { id: "p20-rufles-carne", nombre: "Rufles de Carne", presentacion: U, precio: 210, foto: "fotos/Rufle%20e%20Carne.jpg" },
    { id: "p20-rufles-queso", nombre: "Rufles de Queso", presentacion: U, precio: 210, foto: "fotos/Rufle%20e%20Queso.jpg" },
    { id: "p20-lays-queso",   nombre: "Lays Queso",      presentacion: U, precio: 210, foto: "fotos/Lays%20Queso.jpg" },
    { id: "p20-lays-sal",     nombre: "Lays Sal",        presentacion: U, precio: 210, foto: "fotos/Lay%20Sal.jpg" },
    { id: "p20-lays-limon",   nombre: "Lays Limón",      presentacion: U, precio: 210, foto: "fotos/Lay%20lemon.jpg" },
    { id: "p20-lays-cebolla", nombre: "Lays Cebolla",    presentacion: U, precio: 210, foto: "fotos/La%20cebolla.jpg", disponible: false }
  ]}
};
/* Si ya tienes la página del pedido en Google Sites, pon aquí su dirección para mostrar el botón "Ver mi pedido" */
const URL_PEDIDO = "https://sites.google.com/view/chucheriasblas/compra";
/* Nombres anteriores, para que los enlaces ya usados sigan funcionando */
const ALIAS = { papitas10: "lays_10", papitas15: "lays_15", papitas20: "lays_20", pag2_10: "yummies_10", pag2_15: "yummies_15", pag2_20: "yummies_20", pagina1: "lays", pagina2: "yummies" };

/* ---------- CARRITO COMPARTIDO ---------- */
const KEY = "blas_carrito";
let mem = {}, bc = null;
try { bc = new BroadcastChannel("blas"); bc.onmessage = pintar; } catch (e) {}
window.addEventListener("storage", e => { if (e.key === KEY) pintar(); });
function leer() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return mem; } }
function guardar(c) { mem = c; try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} try { bc && bc.postMessage(1); } catch (e) {} }
function cambiar(id, d) { const c = leer(), n = Math.max(0, (c[id] || 0) + d); if (n) c[id] = n; else delete c[id]; guardar(c); pintar(); }
/* vaciar("lays") borra solo los productos de esa página; vaciar() borra todo el pedido */
function vaciar(pg) { if (pg) { const c = leer(); for (const id in precios(pg)) delete c[id]; guardar(c); } else guardar({}); pintar(); }
function precios(pg) { const m = {}; Object.values(CATALOGO).forEach(k => { if (!pg || k.pagina === pg) k.productos.forEach(p => m[p.id] = p.precio); }); return m; }
/* ---------- VISTAS ---------- */
const fmt = n => "RD$" + n.toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* resumen(pg): suma solo los productos de la página pg; sin pg suma todos */
function resumen(pg) {
  if (pg) pg = ALIAS[pg] || pg;
  const c = leer(), pr = precios(pg); let n = 0, t = 0;
  for (const id in c) if (pr[id] !== undefined) { n += c[id]; t += c[id] * pr[id]; }
  return `<section class="resumen"><h2>Resumen de tu pedido</h2><div class="datos">
  <div><span>Cantidad de Productos</span><strong>${n} ${n === 1 ? "paquete" : "paquetes"}</strong></div>
  <div><span>Costo</span><strong>${fmt(t)}</strong></div></div>
  ${URL_PEDIDO ? `<a class="btn" href="${URL_PEDIDO}" target="_top">Ver mi pedido</a>` : ""}<button class="vaciar" onclick="vaciar(${pg ? "'" + pg + "'" : ""})">Vaciar pedido</button></section>`;
}
/* Botón del carrito junto al título de cada categoría: lleva a la página del pedido (URL_PEDIDO) */
function cabecera(titulo) {
  if (!URL_PEDIDO) return `<h2 class="cat-titulo">${titulo}</h2>`;
  const c = leer(); let n = 0; for (const id in c) n += c[id];
  return `<div class="cat-cab"><span class="esp"></span><h2>${titulo}</h2>
  <a class="carro" href="${URL_PEDIDO}" target="_top" title="Ir a mi pedido" aria-label="Ir a mi pedido${n ? " (" + n + " paquetes)" : ""}">
  <img src="fotos/carrito.png" alt="">
  ${n ? `<span class="num-carro">${n}</span>` : ""}</a></div>`;
}
const foto = p => `<div class="foto">${p.foto ? `<img src="${p.foto}" alt="${p.nombre}">` : ""}</div>`;
function texto(p, c) {
  const off = p.disponible === false;
  return `<div class="txt"><div class="nombre">${p.nombre}</div><div class="dato">${p.presentacion}</div>
  <div class="dato">Precio: $${p.precio}</div>${off ? `<div class="nd">*No Disponible*</div>` : ""}
  <div class="ctrl"><button onclick="cambiar('${p.id}',-1)" aria-label="Quitar uno">−</button><b>${c[p.id] || 0}</b><button onclick="cambiar('${p.id}',1)" aria-label="Añadir uno"${off ? " disabled" : ""}>+</button></div></div>`;
}
function categoria(k) {
  const cat = CATALOGO[k]; if (!cat) return "";
  const c = leer(), ps = cat.productos; let i = 0; const filas = [];
  const dos = () => { const a = ps[i++], b = ps[i++]; filas.push(`<div class="fila dos">${[a, b].map(x => x ? `<div class="col">${foto(x)}${texto(x, c)}</div>` : "<div></div>").join("")}</div>`); };
  for (const t of cat.diseno || []) {
    if (i >= ps.length) break;
    if (t === "dos") dos();
    else if (t === "gal") { const p = ps[i++]; const fs = p.fotos || ["", "", ""]; filas.push(`<div class="fila gal"><div class="pila">${fs.map(f => `<div class="foto">${f ? `<img src="${f}" alt="${p.nombre}">` : ""}</div>`).join("")}</div><div class="principal">${foto(p)}${texto(p, c)}</div></div>`); }
    else { const p = ps[i++]; filas.push(t === "izq" ? `<div class="fila lado">${foto(p)}${texto(p, c)}</div>` : `<div class="fila lado inv">${texto(p, c)}${foto(p)}</div>`); }
  }
  while (i < ps.length) dos();
  return `<section class="cat">${cabecera(cat.titulo)}${filas.join("") || `<p class="pronto">Próximamente.</p>`}</section>`;
}
function pedido() {
  const c = leer();

  const grupos = {
    "Lays": ["lays_10", "lays_15", "lays_20"],
    "Yummies": ["yummies_10", "yummies_15", "yummies_20"]
  };

  let totalGeneral = 0;
  let cantidadGeneral = 0;
  let contenido = "";

  for (const marca in grupos) {
    let subtotalMarca = 0;
    let cantidadMarca = 0;
    let filas = "";

    for (const categoria of grupos[marca]) {
      const grupo = CATALOGO[categoria];
      if (!grupo) continue;

      for (const p of grupo.productos) {
        const q = c[p.id] || 0;
        if (!q) continue;

        const subtotal = q * p.precio;
        subtotalMarca += subtotal;
        cantidadMarca += q;

        filas += `
          <tr>
            <td>${p.nombre}</td>
            <td class="num">${q}</td>
            <td class="num">RD$${p.precio}</td>
            <td class="num">${fmt(subtotal)}</td>
          </tr>`;
      }
    }

    totalGeneral += subtotalMarca;
    cantidadGeneral += cantidadMarca;

    if (cantidadMarca > 0) {
      contenido += `
        <details class="grupo-papitas">
          <summary>
            <span>${marca}</span>
            <strong>${fmt(subtotalMarca)}</strong>
          </summary>
          <div class="tabla-papitas">
            <table>
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="num">Cantidad</th>
                  <th class="num">Precio</th>
                  <th class="num">Subtotal</th>
                </tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </details>`;
    }
  }

  const cuerpo = contenido
    ? `
      <details class="resumen-papitas" open>
        <summary>
          <span>Papitas Lays/Yummies</span>
          <strong>${fmt(totalGeneral)}</strong>
        </summary>
        ${contenido}
        <button class="vaciar" onclick="vaciar()">Vaciar pedido</button>
      </details>`
    : `<p class="vacio">Todavía no has elegido ningún producto.</p>`;

  const totalFijo = `
    <div class="total">
      <span>Cantidad de Productos<br>
        <strong>${cantidadGeneral} ${cantidadGeneral === 1 ? "paquete" : "paquetes"}</strong>
      </span>
      <span>Costo total<br>
        <strong>${fmt(totalGeneral)}</strong>
      </span>
    </div>`;

  return `<section class="pedido">
    <h2>Tu pedido</h2>
    ${cuerpo}
    ${contenido ? totalFijo : ""}
  </section>`;
}

function pintar() {
  let v = new URLSearchParams(location.search).get("vista") || "todo";
  v = ALIAS[v] || v;
  const dePagina = Object.keys(CATALOGO).filter(k => CATALOGO[k].pagina === v);
  document.getElementById("app").innerHTML =
    v === "resumen" ? resumen(new URLSearchParams(location.search).get("pagina")) :
    v.startsWith("resumen_") ? resumen(v.slice(8)) :
    v === "pedido" ? pedido() :
    v === "todo" ? pedido() + [["lays", "Lays"], ["yummies", "Yummies"]].map(([pg, nombre]) =>
      `<h2 class="marca">${nombre}</h2>` + resumen(pg) + Object.keys(CATALOGO).filter(k => CATALOGO[k].pagina === pg).map(categoria).join("")).join("") :
    dePagina.length ? resumen(v) + dePagina.map(categoria).join("") :
    categoria(v);
}
pintar();
</script>
</body>
</html>
