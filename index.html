<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chucherías Blas</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Playfair+Display&display=swap" rel="stylesheet">
<style>
:root{--c1:#d9480f;--c2:#fff4e6;--tx:#1f1f1f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px;font-family:"Open Sans",Arial,sans-serif;color:var(--tx);background:#fff}
.resumen{background:var(--c2);border:2px solid var(--c1);border-radius:14px;padding:16px;margin-bottom:26px}
.resumen h2{margin:0 0 10px;font-size:22px}
.datos{display:flex;gap:16px;flex-wrap:wrap}
.datos div{flex:1;min-width:150px;background:#fff;border-radius:10px;padding:10px 14px}
.datos span{display:block;font-size:14px;color:#666}
.datos strong{font-size:26px;color:var(--c1)}
.vaciar{margin-top:12px;border:0;background:none;color:#666;text-decoration:underline;cursor:pointer;font-size:14px}
.cat{margin-bottom:30px}
.cat>h2{text-align:center;font-size:clamp(30px,4.2vw,50px);margin:0 0 18px;font-weight:700}
.fila{padding:26px 0;border-top:1px solid #e6e6e6;display:grid;gap:28px;align-items:center}
.lado{grid-template-columns:1fr 1fr}
.dos{grid-template-columns:1fr 1fr}
.col{text-align:center}
.foto{aspect-ratio:16/9;background:#f5f5f5;border:2px dashed #e2e2e2;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.txt{text-align:center}
.nombre{font-family:"Playfair Display",Georgia,serif;font-weight:400;line-height:1.2}
.lado .nombre{font-size:clamp(28px,3.6vw,46px);margin-bottom:22px}
.dos .nombre{font-size:clamp(20px,2.2vw,28px);margin:16px 0 18px}
.dato{font-weight:700;font-size:17px;margin:8px 0}
.nd{color:#b00020;font-weight:700;font-size:16px;margin:0 0 6px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.ctrl button{width:40px;height:40px;border-radius:50%;border:2px solid var(--c1);background:#fff;color:var(--c1);font-size:24px;line-height:1;cursor:pointer}
.ctrl button:active{background:var(--c1);color:#fff}
.ctrl button:disabled{opacity:.3;cursor:not-allowed}
.ctrl b{min-width:28px;font-size:21px}
.gal{grid-template-columns:1fr 2fr;align-items:start}
.pila{display:grid;gap:12px}
.pila .foto,.principal .foto{aspect-ratio:4/3}
.principal .txt{margin-top:16px}
.btn{display:inline-block;margin-top:12px;margin-right:14px;padding:9px 18px;border-radius:24px;background:var(--c1);color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.pedido{max-width:760px;margin:0 auto}
.pedido h2{text-align:center;font-size:clamp(28px,4vw,44px);margin:0 0 18px}
.pedido table{width:100%;border-collapse:collapse;font-size:17px}
.pedido th{font-size:14px;color:#666;text-align:left;border-bottom:2px solid var(--c1);padding:8px 6px}
.pedido td{padding:12px 6px;border-bottom:1px solid #e6e6e6;vertical-align:top}
.pedido .num,.pedido th.num{text-align:right;white-space:nowrap}
.total{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--c2);border:2px solid var(--c1);border-radius:14px;padding:16px 20px;margin-top:20px;font-weight:700}
.total strong{font-size:28px;color:var(--c1)}
.vacio{text-align:center;color:#777;padding:30px 0}
.pronto{text-align:center;color:#888;font-style:italic}
.pasos{display:flex;justify-content:center;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.pasos span{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:#f1f1f1;color:#777;font-size:14px;font-weight:700}
.pasos b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#bbb;color:#fff;align-items:center;justify-content:center;font-size:13px}
.pasos .act{background:var(--c2);color:var(--c1);box-shadow:inset 0 0 0 2px var(--c1)}
.pasos .act b,.pasos .hecho b{background:var(--c1)}
.pasos .hecho{color:var(--c1)}
.acciones{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:22px}
.btn-prim,.btn-sec{padding:14px 26px;border-radius:30px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.btn-prim{background:var(--c1);color:#fff;border:2px solid var(--c1)}
.btn-prim:hover{filter:brightness(1.08)}
.btn-prim:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn-sec{background:#fff;color:var(--c1);border:2px solid var(--c1)}
.check{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;cursor:pointer;padding:14px 16px;border:2px solid #e6e6e6;border-radius:14px}
.check input{width:24px;height:24px;accent-color:var(--c1);flex:none}
.sub{text-align:center;color:#666;margin:-8px 0 18px}
.tarjeta{border:2px solid #e6e6e6;border-radius:14px;padding:16px 18px;margin-bottom:18px}
.tarjeta h3{margin:0 0 8px;font-size:18px}
.ok{background:#e8f6ec;color:#1b5e20;border-radius:10px;padding:12px 14px;font-weight:700;margin-top:16px}
.mar{margin:18px 0 4px;font-size:20px;color:var(--c1)}
.cat-titulo{text-align:center;font-size:clamp(30px,4.2vw,50px);margin:0 0 18px;font-weight:700}
.cat-cab{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.cat-cab h2{flex:1;margin:0;text-align:center;font-size:clamp(30px,4.2vw,50px);font-weight:700}
.cat-cab .esp{width:58px;flex:none}
.carro{position:relative;flex:none;width:58px;height:58px;display:block;border-radius:16px;transition:transform .15s,box-shadow .15s}
.carro img{width:100%;height:100%;display:block}
.carro:hover,.carro:focus-visible{transform:translateY(-2px);box-shadow:0 6px 14px rgba(217,72,15,.35)}
.carro:active{transform:none;box-shadow:none}
.carro .num-carro{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c1);color:#fff;border:2px solid #fff;font-size:13px;font-weight:700;line-height:20px;text-align:center}
.marca{text-align:center;font-size:clamp(36px,5vw,60px);margin:50px 0 10px;padding-top:24px;border-top:4px solid var(--c1);color:var(--c1)}
@media(max-width:600px){.gal{grid-template-columns:1fr}.pila{grid-template-columns:repeat(3,1fr)}.lado{grid-template-columns:1fr}.lado.inv .foto{order:-1}.dos{gap:14px}.fila{padding:20px 0}}
.cant{width:76px;height:40px;text-align:center;font:inherit;font-size:20px;font-weight:700;border:2px solid var(--c1);border-radius:10px}.grupo-papitas{border:2px solid var(--c1);border-radius:14px;margin:0 0 14px;background:#fff}.grupo-papitas summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;padding:14px 16px;font-weight:700;font-size:20px}.grupo-papitas summary strong{color:var(--c1)}.tabla-papitas{padding:0 14px 12px}
</style>
</head>
<body>
<main id="app"></main>

  limpieza_hogar: {"pagina": "limpieza", "titulo": "Limpieza del Hogar", "productos": [{"id": "lh-fabuloso", "nombre": "Fabuloso Sobres", "precio": 150}, {"id": "lh-suavitel-maciel", "nombre": "Suavitel Maciel", "precio": 130}, {"id": "lh-suavitel-sobres", "nombre": "Suavitel Sobres", "precio": 190}, {"id": "lh-bri", "nombre": "Suavizante Bri Mini", "precio": 260}, {"id": "lh-cloro-20", "nombre": "Cloro de 20", "presentacion": "64 Unidades", "precio": 900}, {"id": "lh-cloro-15", "nombre": "Cloro Maciel de 15", "presentacion": "80 Unidades", "precio": 840}]},
  limpieza_personal: {"pagina": "limpieza", "titulo": "Cuidado Personal", "productos": [{"id": "lp-protex", "nombre": "Jabón Protex", "precio": 50}, {"id": "lp-sunami", "nombre": "Jabón Sunami", "precio": 130}, {"id": "lp-afeitadora", "nombre": "Afeitadora Amarilla", "presentacion": "36 Unidades", "precio": 800}, {"id": "lp-nos-diaria", "nombre": "Nosotras Diaria", "precio": 400}, {"id": "lp-nos-moradas", "nombre": "Nosotras Moradas", "precio": 520}, {"id": "lp-nos-rosadas", "nombre": "Nosotras Rosadas", "precio": 475}, {"id": "lp-gelatina", "nombre": "Gelatina Dady (para el cabello)", "precio": 330}]},
  especiales_medicamentos: {"pagina": "especiales", "titulo": "Medicamentos", "productos": [{"id": "em-acetaminofen", "nombre": "Acetaminofén", "precio": 250}, {"id": "em-ibuprofeno", "nombre": "Ibuprofeno", "precio": 400}, {"id": "em-omeprazol", "nombre": "Omeprazol", "precio": 300}, {"id": "em-diclofenar", "nombre": "Diclofenar D 100", "precio": 300}, {"id": "em-dicloplefuerte", "nombre": "Dicloplé Forte", "precio": 1300}, {"id": "em-amoxicilina", "nombre": "Amoxicilina 500", "precio": 400}, {"id": "em-ampicilina", "nombre": "Ampicilina 1000", "precio": 800}, {"id": "em-alka-azul", "nombre": "Alka Seltzer Azul", "precio": 1300}, {"id": "em-alka-negro", "nombre": "Alka Seltzer Negro", "precio": 1700}, {"id": "em-antiflude-past", "nombre": "Antiflude Pastilla", "precio": 450}, {"id": "em-antiflude-peq", "nombre": "Antiflude Pequeño", "precio": 500}, {"id": "em-antiflude-forte", "nombre": "Antiflude Forte Pastilla", "precio": 850}, {"id": "em-antiflude-te", "nombre": "Antiflude Té", "precio": 35}, {"id": "em-cardioaspirina", "nombre": "Cardioaspirina", "precio": 720}, {"id": "em-resfridol", "nombre": "Resfridol Antigripal Pastilla", "precio": 900}, {"id": "em-tabcin-noche", "nombre": "Tabcin Noche", "precio": 1300}, {"id": "em-tapcin-dia", "nombre": "Tapcin Día", "precio": 1400}, {"id": "em-algo-amarillo", "nombre": "Algo Amarillo", "precio": 1300}, {"id": "em-algo-limon", "nombre": "Algo Limón", "precio": 1200}, {"id": "em-algo-te", "nombre": "Algo Té Antigripal", "precio": 1300}, {"id": "em-algo-ultra", "nombre": "Algo Ultra", "precio": 1500}, {"id": "em-winasord", "nombre": "Winasord", "precio": 840}]},
  especiales_alimentos: {"pagina": "especiales", "titulo": "Alimentos y Bebidas", "productos": [{"id": "ea-ace", "nombre": "Ace El Compadre 30 Lb", "precio": 1100}, {"id": "ea-aceite-linda", "nombre": "Aceite Pequeño Linda", "presentacion": "60 Unidades", "precio": 1380, "frac": true}, {"id": "ea-king-pride", "nombre": "King Pride Kanel", "presentacion": "48 Unidades", "precio": 5800, "frac": true}, {"id": "ea-ajo", "nombre": "Ajo en Sobre", "precio": 220}, {"id": "ea-codito", "nombre": "Codito Media Libra", "precio": 20}, {"id": "ea-espagueti", "nombre": "Espagueti 1 Libra", "precio": 40}, {"id": "ea-hab-linda", "nombre": "Habichuela Linda Lata", "precio": 60}, {"id": "ea-hab-roja", "nombre": "Habichuela Roja Linda Lata", "precio": 60}, {"id": "ea-harina", "nombre": "Harina El Negrito", "precio": 35}, {"id": "ea-leche-coco", "nombre": "Leche Coco Mamá", "precio": 70}, {"id": "ea-vinagre-ambar", "nombre": "Vinagre Ámbar", "precio": 25}, {"id": "ea-vainilla", "nombre": "Vainilla de 80", "precio": 560}, {"id": "ea-sardina", "nombre": "Sardina Paco Fish Ovalada", "precio": 100}, {"id": "ea-anejo", "nombre": "Añejo Litro", "precio": 565}, {"id": "ea-brugal-350", "nombre": "Brugal Extra Viejo 350cc", "precio": 310}, {"id": "ea-brugal-medio", "nombre": "Brugal Extraviejo 1/2", "precio": 310}, {"id": "ea-vino", "nombre": "Vino Tinto Campeón Galón", "precio": 515}]},
  especiales_otros: {"pagina": "especiales", "titulo": "Otros Pedidos Especiales", "productos": [{"id": "eo-muriatico", "nombre": "Ácido Muriático", "precio": 50}, {"id": "eo-alcanfor", "nombre": "Alcanfor", "precio": 600}, {"id": "eo-amoniaco", "nombre": "Amoníaco", "precio": 45}, {"id": "eo-cloro-medio", "nombre": "Cloro 1/2 Galón", "precio": 350}, {"id": "eo-cloro-16", "nombre": "Cloro de 16 Onzas", "precio": 600}, {"id": "eo-gas", "nombre": "Botella de Gas", "precio": 55}, {"id": "eo-911", "nombre": "Energizante 911", "precio": 36}, {"id": "eo-vive", "nombre": "Energizante Vive 100 Pequeño", "precio": 42}]}
};
/* Secciones (páginas de Google Sites) en el orden del resumen */
const PAGINAS = {"lays": "Lays", "yummies": "Yummies", "galletas": "Galletas", "chucherias": "Chucherías", "consumibles": "Consumibles y Utilidades", "chocolates": "Chocolates", "bebidas": "Bebidas", "juguetes": "Juguetes", "limpieza": "Limpieza y Cuidado Personal", "especiales": "Pedidos Especiales"};
/* Si ya tienes la página del pedido en Google Sites, pon aquí su dirección para mostrar el botón "Ver mi pedido" */
const URL_PEDIDO = "https://sites.google.com/view/chucheriasblas/compra";
/* ====== FLUJO DE COMPRA: Pedido -> Formulario -> Resumen final ======
   URL_FORMULARIO: dirección de tu página de Google Sites donde está el formulario (Contacto).
   URL_FINAL: dirección de la página final de Google Sites (la que lleva ?vista=final).
   WHATSAPP: número donde recibes los pedidos, con código de país, solo números (ej.: "18095551234").
   PEDIR_CONFIRMACION: true = el botón de seguir se activa cuando el cliente marca "Ya llené el formulario". */
const URL_FORMULARIO = "https://sites.google.com/view/chucheriasblas/contacto";
const URL_FINAL = "https://sites.google.com/view/chucheriasblas/confirmar";
const WHATSAPP = "18296332348";
const PEDIR_CONFIRMACION = true;
/* DESTINO: cómo se abren los enlaces. Google Sites bloquea "_top" dentro de los bloques incrustados, por eso se abren en pestaña nueva ("_blank").
   Si algún día quieres probar que navegue en la misma pestaña, cambia a "_top". */
const DESTINO = "_blank";
/* Nombres anteriores, para que los enlaces ya usados sigan funcionando */
const ALIAS = { papitas10: "lays_10", papitas15: "lays_15", papitas20: "lays_20", pag2_10: "yummies_10", pag2_15: "yummies_15", pag2_20: "yummies_20", pagina1: "lays", pagina2: "yummies" };

/* ---------- CARRITO COMPARTIDO ---------- */
const KEY = "blas_carrito";
let mem = {}, bc = null;
try { bc = new BroadcastChannel("blas"); bc.onmessage = pintar; } catch (e) {}
window.addEventListener("storage", e => { if (e.key === KEY) pintar(); });
function leer() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return mem; } }
function guardar(c) { mem = c; try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} try { bc && bc.postMessage(1); } catch (e) {} }
function cambiar(id, d) { const c = leer(), n = Math.max(0, (c[id] || 0) + d); if (n) c[id] = n; else delete c[id]; guardar(c); pintar(); }
/* vaciar("lays") borra solo los productos de esa página; vaciar() borra todo el pedido */
/* poner(id, valor): escribe la cantidad a mano; se redondea a cuartos (0.25) */
function poner(id, v) { const n = Math.max(0, Math.round(parseFloat(v) * 4) / 4) || 0, c = leer(); if (n) c[id] = n; else delete c[id]; guardar(c); pintar(); }
function vaciar(pg) { if (pg) { const c = leer(); for (const id in precios(pg)) delete c[id]; guardar(c); } else guardar({}); pintar(); }
function precios(pg) { const m = {}; Object.values(CATALOGO).forEach(k => { if (!pg || k.pagina === pg) k.productos.forEach(p => m[p.id] = p.precio); }); return m; }
/* ---------- VISTAS ---------- */
const fmt = n => "RD$" + n.toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* resumen(pg): suma solo los productos de la página pg; sin pg suma todos */
function resumen(pg) {
  if (pg) pg = ALIAS[pg] || pg;
  const c = leer(), pr = precios(pg); let n = 0, t = 0;
  for (const id in c) if (pr[id] !== undefined) { n += c[id]; t += c[id] * pr[id]; }
  return `<section class="resumen"><h2>Resumen de tu pedido</h2><div class="datos">
  <div><span>Cantidad de Productos</span><strong>${n} ${n === 1 ? "paquete" : "paquetes"}</strong></div>
  <div><span>Costo</span><strong>${fmt(t)}</strong></div></div>
  ${URL_PEDIDO ? `<a class="btn" href="${URL_PEDIDO}" target="${DESTINO}">Ver mi pedido</a>` : ""}<button class="vaciar" onclick="vaciar(${pg ? "'" + pg + "'" : ""})">Vaciar pedido</button></section>`;
}
/* Botón del carrito junto al título de cada categoría: lleva a la página del pedido (URL_PEDIDO) */
function cabecera(titulo) {
  if (!URL_PEDIDO) return `<h2 class="cat-titulo">${titulo}</h2>`;
  const c = leer(); let n = 0; for (const id in c) n += c[id];
  return `<div class="cat-cab"><span class="esp"></span><h2>${titulo}</h2>
  <a class="carro" href="${URL_PEDIDO}" target="${DESTINO}" title="Ir a mi pedido" aria-label="Ir a mi pedido${n ? " (" + n + " paquetes)" : ""}">
  <img src="fotos/carrito.png" alt="">
  ${n ? `<span class="num-carro">${n}</span>` : ""}</a></div>`;
}
const foto = p => `<div class="foto">${p.foto ? `<img src="${p.foto}" alt="${p.nombre}">` : ""}</div>`;
function texto(p, c) {
  const off = p.disponible === false, sp = p.precio === undefined, q = c[p.id] || 0, s = p.frac ? 0.25 : 1;
  const cen = p.frac ? `<input class="cant" type="number" min="0" step="0.25" value="${q}" onchange="poner('${p.id}',this.value)" aria-label="Cantidad">` : `<b>${q}</b>`;
  return `<div class="txt"><div class="nombre">${p.nombre}</div>${p.presentacion ? `<div class="dato">${p.presentacion}</div>` : ""}
  <div class="dato">${sp ? "Precio por confirmar" : "Precio: RD$" + p.precio}</div>${off ? `<div class="nd">*No Disponible*</div>` : ""}
  ${sp ? "" : `<div class="ctrl"><button onclick="cambiar('${p.id}',-${s})" aria-label="Quitar">−</button>${cen}<button onclick="cambiar('${p.id}',${s})" aria-label="Añadir"${off ? " disabled" : ""}>+</button></div>`}</div>`;
}
function categoria(k) {
  const cat = CATALOGO[k]; if (!cat) return "";
  const c = leer(), ps = cat.productos; let i = 0; const filas = [];
  const dos = () => { const a = ps[i++], b = ps[i++]; filas.push(`<div class="fila dos">${[a, b].map(x => x ? `<div class="col">${foto(x)}${texto(x, c)}</div>` : "<div></div>").join("")}</div>`); };
  for (const t of cat.diseno || []) {
    if (i >= ps.length) break;
    if (t === "dos") dos();
    else if (t === "gal") { const p = ps[i++]; const fs = p.fotos || ["", "", ""]; filas.push(`<div class="fila gal"><div class="pila">${fs.map(f => `<div class="foto">${f ? `<img src="${f}" alt="${p.nombre}">` : ""}</div>`).join("")}</div><div class="principal">${foto(p)}${texto(p, c)}</div></div>`); }
    else { const p = ps[i++]; filas.push(t === "izq" ? `<div class="fila lado">${foto(p)}${texto(p, c)}</div>` : `<div class="fila lado inv">${texto(p, c)}${foto(p)}</div>`); }
  }
  while (i < ps.length) dos();
  return `<section class="cat">${cabecera(cat.titulo)}${filas.join("") || `<p class="pronto">Próximamente.</p>`}</section>`;
}
function pedido(conBoton) {
  const p = armarPedido();
  const cuerpo = p.marcas.length ? p.marcas.map(m => `<details class="grupo-papitas"><summary><span>${m.nombre}</span><strong>${fmt(m.sub)}</strong></summary><div class="tabla-papitas"><table><thead><tr><th>Producto</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Subtotal</th></tr></thead><tbody>${m.filas.map(f => `<tr><td>${f.nombre}</td><td class="num">${f.q}</td><td class="num">RD$${f.precio}</td><td class="num">${fmt(f.sub)}</td></tr>`).join("")}</tbody></table></div></details>`).join("") + `<button class="vaciar" onclick="vaciar()">Vaciar pedido</button>` : `<p class="vacio">Todavía no has elegido ningún producto.</p>`;
  const tot = p.marcas.length ? `<div class="total"><span>Cantidad de Productos<br><strong>${p.cant} ${p.cant === 1 ? "paquete" : "paquetes"}</strong></span><span>Costo total<br><strong>${fmt(p.total)}</strong></span></div>` : "";
  return `<section class="pedido">${conBoton ? pasos(1) : ""}<h2>Tu pedido</h2>${cuerpo}${tot}
  ${conBoton && p.marcas.length && URL_FORMULARIO ? `<div class="acciones"><span></span><a class="btn-prim" href="${URL_FORMULARIO}" target="${DESTINO}">Continuar</a></div>` : ""}</section>`;
}

/* ---------- Pasos del flujo de compra ---------- */
let yaLleno = false, enviado = false;
const pasos = n => `<div class="pasos">${["Pedido", "Formulario", "Confirmar"].map((t, i) => `<span class="${i + 1 === n ? "act" : i + 1 < n ? "hecho" : ""}"><b>${i + 1}</b>${t}</span>`).join("")}</div>`;
/* Arma el pedido por marca. Las categorías se toman solas de CATALOGO (según "pagina"), así que las nuevas se incluyen sin tocar nada */
function armarPedido() {
  const c = leer(); let total = 0, cant = 0; const marcas = [];
  for (const [pg, nombre] of Object.entries(PAGINAS)) {
    const filas = []; let sub = 0;
    for (const k of Object.keys(CATALOGO).filter(k => CATALOGO[k].pagina === pg))
      for (const p of CATALOGO[k].productos) { const q = c[p.id] || 0; if (q) { filas.push({ nombre: p.nombre, q, precio: p.precio, sub: q * p.precio }); sub += q * p.precio; cant += q; } }
    total += sub; if (filas.length) marcas.push({ nombre, filas, sub });
  }
  return { marcas, total, cant };
}
/* Paso 2: este bloque va debajo del formulario, en la página del formulario */
function continuar() {
  const p = armarPedido();
  if (!p.cant) return `<section class="pedido">${pasos(2)}<p class="vacio">Todavía no has elegido ningún producto.</p></section>`;
  const listo = !PEDIR_CONFIRMACION || yaLleno;
  const boton = listo && URL_FINAL
    ? `<a class="btn-prim" href="${URL_FINAL}" target="${DESTINO}">Continuar al resumen final</a>`
    : `<button class="btn-prim" disabled>Continuar al resumen final</button>`;
  return `<section class="pedido">${pasos(2)}
  ${PEDIR_CONFIRMACION ? `<label class="check"><input type="checkbox" ${yaLleno ? "checked" : ""} onchange="yaLleno=this.checked;pintar()"><span>Ya llené y envié el formulario</span></label>` : ""}
  <div class="acciones"><span></span>${boton}</div></section>`;
}
function mensajePedido() {
  const p = armarPedido();
  let t = "*Pedido - Chucherías Blas*\n";
  p.marcas.forEach(m => { t += "\n*" + m.nombre + "*\n"; m.filas.forEach(f => { t += "- " + f.q + " x " + f.nombre + " (RD$" + f.precio + ") = " + fmt(f.sub) + "\n"; }); });
  t += "\n*Total: " + p.cant + (p.cant === 1 ? " paquete" : " paquetes") + " - " + fmt(p.total) + "*";
  return t;
}
function marcarEnviado() { setTimeout(() => { enviado = true; pintar(); }, 400); }
/* Paso 3: resumen final con el botón de enviar por WhatsApp */
function final() {
  const p = armarPedido();
  if (!p.cant) return `<section class="pedido">${pasos(3)}<p class="vacio">Todavía no has elegido ningún producto.</p></section>`;
  const tablas = p.marcas.map(m => `<h3 class="mar">${m.nombre}</h3><table><thead><tr><th>Producto</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Subtotal</th></tr></thead><tbody>${m.filas.map(f => `<tr><td>${f.nombre}</td><td class="num">${f.q}</td><td class="num">RD$${f.precio}</td><td class="num">${fmt(f.sub)}</td></tr>`).join("")}</tbody></table>`).join("");
  const envio = WHATSAPP
    ? `<a class="btn-prim" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensajePedido())}" target="_blank" rel="noopener" onclick="marcarEnviado()">Enviar pedido por WhatsApp</a>`
    : `<button class="btn-prim" disabled>Enviar pedido por WhatsApp</button>`;
  return `<section class="pedido">${pasos(3)}<h2>Confirma tu pedido</h2>
  <div class="tarjeta">${tablas}
    <div class="total"><span>Cantidad de Productos<br><strong>${p.cant} ${p.cant === 1 ? "paquete" : "paquetes"}</strong></span><span>Costo total<br><strong>${fmt(p.total)}</strong></span></div></div>
  <div class="acciones">${URL_PEDIDO ? `<a class="btn-sec" href="${URL_PEDIDO}" target="${DESTINO}">Modificar pedido</a>` : "<span></span>"}${envio}</div>
  ${enviado ? `<p class="ok">Se abrió WhatsApp con tu pedido. Pulsa «Enviar» allí para que nos llegue.</p><button class="vaciar" onclick="vaciar()">Listo, vaciar mi pedido</button>` : ""}
  </section>`;
}

function pintar() {
  let v = new URLSearchParams(location.search).get("vista") || "todo";
  v = ALIAS[v] || v;
  const dePagina = Object.keys(CATALOGO).filter(k => CATALOGO[k].pagina === v);
  document.getElementById("app").innerHTML =
    v === "resumen" ? resumen(new URLSearchParams(location.search).get("pagina")) :
    v.startsWith("resumen_") ? resumen(v.slice(8)) :
    v === "pedido" ? pedido(true) :
    v === "continuar" ? continuar() :
    v === "final" ? final() :
    v === "todo" ? pedido() + Object.entries(PAGINAS).map(([pg, nombre]) =>
      `<h2 class="marca">${nombre}</h2>` + resumen(pg) + Object.keys(CATALOGO).filter(k => CATALOGO[k].pagina === pg).map(categoria).join("")).join("") :
    dePagina.length ? resumen(v) + dePagina.map(categoria).join("") :
    categoria(v);
}
pintar();
</script>
